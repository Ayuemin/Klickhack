name: Build PSCH46 Offline APK

on:
  push:
    branches: [build-psch46-apk]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare maximum offline assets, safe routes and icon
        run: |
          python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml cairosvg
          mkdir -p android-psch46/app/src/main/assets/www android-psch46/app/src/main/res/drawable
          curl -fL --retry 5 --retry-delay 2 https://unpkg.com/leaflet@1.9.4/dist/leaflet.js -o android-psch46/app/src/main/assets/www/leaflet.js
          curl -fL --retry 5 --retry-delay 2 https://unpkg.com/leaflet@1.9.4/dist/leaflet.css -o android-psch46/app/src/main/assets/www/leaflet.css
          python -c "import cairosvg; cairosvg.svg2png(url='android-psch46/tools/app_icon.svg',write_to='android-psch46/app/src/main/res/drawable/app_icon.png',output_width=512,output_height=512)"
          python android-psch46/tools/build_offline_data_locality.py
          python android-psch46/tools/capture_named_places.py
          python android-psch46/tools/normalize_settlement_aliases.py
          python android-psch46/tools/fix_catalog.py
          python android-psch46/tools/enrich_max_dataset.py
          python android-psch46/tools/reroute_firetruck_safe_balanced.py
          python android-psch46/tools/audit_route_river_crossings.py
          test -s android-psch46/app/src/main/assets/www/data.js
          test -s android-psch46/app/src/main/assets/www/route-enhancements.js
          test -s android-psch46/app/src/main/res/drawable/app_icon.png
          grep -q '"catalogVerified":true' android-psch46/app/src/main/assets/www/data.js
          grep -q '"maxDataset":true' android-psch46/app/src/main/assets/www/data.js
          grep -q '"officialCount":306' android-psch46/app/src/main/assets/www/data.js
          grep -q '"routeValidation":true' android-psch46/app/src/main/assets/www/data.js
          grep -q '"routingProfile":"firetruck-safe-balanced-v2.1"' android-psch46/app/src/main/assets/www/data.js
          grep -q '"riverCrossingAudit":true' android-psch46/app/src/main/assets/www/data.js
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('android-psch46/app/src/main/assets/www/data.js')
          s=p.read_text(encoding='utf-8').strip()[len('window.OFFLINE_DATA='):]
          if s.endswith(';'): s=s[:-1]
          d=json.loads(s)
          assert len(d['settlements']) == 306
          assert len(d.get('centers',[])) >= 11
          assert len(d.get('dpk',[])) == 4
          assert len(d.get('territories',[])) == 11
          assert d['meta']['totalTrainingPoints'] >= 306
          assert d['meta']['safeRoutes'] == d['meta']['totalTrainingPoints']
          assert d['meta']['routeValidation'] is True
          assert d['meta']['riverCrossingAudit'] is True
          assert d['meta']['truckProfile']['mass_t'] == 20.0
          assert all(len(x.get('route',[])) > 1 for x in d['settlements'])
          print('Validated safe dataset:', d['meta'])
          print('Official routes with intermediate settlements:', sum(1 for x in d['settlements'] if x.get('via')))
          PY
          echo "Offline data size: $(du -h android-psch46/app/src/main/assets/www/data.js | cut -f1)"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build MAX safe-route APK
        run: |
          gradle -p android-psch46 assembleDebug --stacktrace
          cp android-psch46/app/build/outputs/apk/debug/app-debug.apk PSCH46-Rayon-Trainer-MAX-v2.1-safe-route.apk

      - name: Verify APK has no INTERNET permission
        run: |
          $ANDROID_HOME/build-tools/35.0.0/aapt dump permissions PSCH46-Rayon-Trainer-MAX-v2.1-safe-route.apk | tee permissions.txt
          if grep -q 'android.permission.INTERNET' permissions.txt; then echo 'Unexpected INTERNET permission'; exit 1; fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PSCH46-Rayon-Trainer-MAX-v2.1-safe-route
          path: PSCH46-Rayon-Trainer-MAX-v2.1-safe-route.apk
