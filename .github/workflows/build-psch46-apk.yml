name: Build PSCH46 Offline APK

on:
  push:
    branches: [build-psch46-apk]
  workflow_dispatch:

concurrency:
  group: psch46-offline-final-build
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore verified v2 base and add route audit + water
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install --disable-pip-version-check requests cairosvg
          mkdir -p android-psch46/app/src/main/assets/www android-psch46/app/src/main/res/drawable /tmp/base
          curl -fL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9907765727/zip -o /tmp/base.zip
          unzip -q /tmp/base.zip -d /tmp/base
          BASE_APK=$(find /tmp/base -name '*.apk' | head -1)
          test -n "$BASE_APK"
          unzip -p "$BASE_APK" assets/www/data.js > android-psch46/app/src/main/assets/www/data.js
          curl -fL --retry 5 --retry-delay 2 https://unpkg.com/leaflet@1.9.4/dist/leaflet.js -o android-psch46/app/src/main/assets/www/leaflet.js
          curl -fL --retry 5 --retry-delay 2 https://unpkg.com/leaflet@1.9.4/dist/leaflet.css -o android-psch46/app/src/main/assets/www/leaflet.css
          python -c "import cairosvg; cairosvg.svg2png(url='android-psch46/tools/app_icon.svg',write_to='android-psch46/app/src/main/res/drawable/app_icon.png',output_width=512,output_height=512)"
          python android-psch46/tools/audit_existing_routes_fast.py
          python android-psch46/tools/enrich_water_sources_fast.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('android-psch46/app/src/main/assets/www/data.js')
          s=p.read_text(encoding='utf-8').strip()[len('window.OFFLINE_DATA='):]
          if s.endswith(';'): s=s[:-1]
          d=json.loads(s)
          points=list(d.get('settlements',[]))+list(d.get('extraPlaces',[]))
          byid={x.get('id'):x for x in points}
          for group in ('centers','dpk'):
              for x in d.get(group,[]):
                  src=byid.get(x.get('id'))
                  if src:
                      for k in ('route','distanceKm','via','routeSnapKm','routeVerified','routeWarnings','nearWater'):
                          x[k]=src.get(k, [] if k in ('via','routeWarnings','nearWater') else None)
          d.setdefault('meta',{})['routingProfile']='firetruck-safe-audited-existing-v2.2'
          d['meta']['version']='2.2-final'
          d['meta']['finalBuild']=True
          p.write_text('window.OFFLINE_DATA='+json.dumps(d,ensure_ascii=False,separators=(',',':'))+';\n',encoding='utf-8')
          PY
          test -s android-psch46/app/src/main/assets/www/data.js
          test -s android-psch46/app/src/main/assets/www/route-enhancements.js
          grep -q '"officialCount":306' android-psch46/app/src/main/assets/www/data.js
          grep -q '"routeValidation":true' android-psch46/app/src/main/assets/www/data.js
          grep -q '"waterLayer":true' android-psch46/app/src/main/assets/www/data.js
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('android-psch46/app/src/main/assets/www/data.js')
          s=p.read_text(encoding='utf-8').strip()[len('window.OFFLINE_DATA='):]
          if s.endswith(';'): s=s[:-1]
          d=json.loads(s); official=d['settlements']
          assert len(official)==306
          assert len(d.get('centers',[]))==11
          assert len(d.get('dpk',[]))==4
          assert len(d.get('territories',[]))==11
          assert d['meta']['waterFeatureCount']>0
          assert all(len(x.get('route',[]))>1 for x in official)
          assert all('routeVerified' in x for x in official)
          assert all('nearWater' in x for x in official)
          assert all('nearWater' in x for x in d.get('centers',[]))
          assert all('nearWater' in x for x in d.get('dpk',[]))
          verified=sum(1 for x in official if x.get('routeVerified'))
          assert verified>=250, verified
          print('OFFICIAL',len(official),'VERIFIED_ROUTES',verified,'UNVERIFIED',306-verified)
          print('UNVERIFIED_NAMES',[x['name'] for x in official if not x.get('routeVerified')])
          print('WATER_FEATURES',d['meta']['waterFeatureCount'])
          print('WITH_VIA',sum(1 for x in official if x.get('via')))
          print('WITH_NEAR_WATER',sum(1 for x in official if x.get('nearWater')))
          PY

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build final APK
        run: |
          gradle -p android-psch46 assembleDebug --stacktrace
          cp android-psch46/app/build/outputs/apk/debug/app-debug.apk PSCH46-Rayon-Trainer-MAX-v2.2-FINAL.apk

      - name: Verify APK has no INTERNET permission
        run: |
          $ANDROID_HOME/build-tools/35.0.0/aapt dump permissions PSCH46-Rayon-Trainer-MAX-v2.2-FINAL.apk | tee permissions.txt
          if grep -q 'android.permission.INTERNET' permissions.txt; then echo 'Unexpected INTERNET permission'; exit 1; fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PSCH46-Rayon-Trainer-MAX-v2.2-FINAL
          path: PSCH46-Rayon-Trainer-MAX-v2.2-FINAL.apk
