name: Build PSCH46 Offline APK

on:
  push:
    branches: [build-psch46-apk]
  workflow_dispatch:

concurrency:
  group: psch46-offline-ui-only-v221
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore already-audited offline data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p android-psch46/app/src/main/assets/www android-psch46/app/src/main/res/drawable /tmp/base
          curl -fL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9910881207/zip -o /tmp/base.zip
          unzip -q /tmp/base.zip -d /tmp/base
          BASE_APK=$(find /tmp/base -name '*.apk' | head -1)
          test -n "$BASE_APK"
          unzip -p "$BASE_APK" assets/www/data.js > android-psch46/app/src/main/assets/www/data.js
          unzip -p "$BASE_APK" assets/www/leaflet.js > android-psch46/app/src/main/assets/www/leaflet.js
          unzip -p "$BASE_APK" assets/www/leaflet.css > android-psch46/app/src/main/assets/www/leaflet.css
          unzip -p "$BASE_APK" res/drawable/app_icon.png > android-psch46/app/src/main/res/drawable/app_icon.png
          test -s android-psch46/app/src/main/assets/www/data.js
          test -s android-psch46/app/src/main/assets/www/route-enhancements.js
          grep -q '"officialCount":306' android-psch46/app/src/main/assets/www/data.js
          grep -q '"waterFeatureCount":1222' android-psch46/app/src/main/assets/www/data.js
          grep -q '"verifiedOfficialRoutes":291' android-psch46/app/src/main/assets/www/data.js

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build final APK
        run: |
          gradle -p android-psch46 assembleDebug --stacktrace
          cp android-psch46/app/build/outputs/apk/debug/app-debug.apk PSCH46-Rayon-Trainer-MAX-v2.2.1-FINAL.apk

      - name: Verify APK has no INTERNET permission
        run: |
          $ANDROID_HOME/build-tools/35.0.0/aapt dump permissions PSCH46-Rayon-Trainer-MAX-v2.2.1-FINAL.apk | tee permissions.txt
          if grep -q 'android.permission.INTERNET' permissions.txt; then echo 'Unexpected INTERNET permission'; exit 1; fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PSCH46-Rayon-Trainer-MAX-v2.2.1-FINAL
          path: PSCH46-Rayon-Trainer-MAX-v2.2.1-FINAL.apk
